name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security-gate:
    permissions:
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy on open security alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scans=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" --paginate --jq -r '.[] | "\(.rule.severity // "?") \(.rule.id // "?") \(.most_recent_instance.location.path // "?"):\(.most_recent_instance.location.start_line // "?")"')
          if [ -n "$scans" ]; then
            echo "Blocking deploy: open code-scanning alert(s):"
            printf '%s\n' "$scans" | sed 's/^/  /'
            exit 1
          fi
          deps=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" --paginate --jq -r '.[] | "\(.security_vulnerability.severity // "?") \(.security_vulnerability.package.name // "?") \(.security_advisory.summary // "?")"')
          if [ -n "$deps" ]; then
            echo "Blocking deploy: open Dependabot alert(s):"
            printf '%s\n' "$deps" | sed 's/^/  /'
            exit 1
          fi
          secrets=$(gh api "repos/${{ github.repository }}/secret-scanning/alerts?state=open&per_page=100" --paginate --jq -r '.[] | "\(.secret_type) \(.url)"')
          if [ -n "$secrets" ]; then
            echo "Blocking deploy: open secret-scanning alert(s):"
            while read -r type url; do
              paths=$(gh api "$url/locations" --jq -r '.[].details.path // empty' | paste -sd, -)
              echo "  $type ${paths:-location unknown}"
            done < <(printf '%s\n' "$secrets")
            exit 1
          fi
          echo "No open security alerts"
  build:
    needs: security-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs:
      - build
      - security-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
