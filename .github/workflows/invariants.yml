name: Invariants

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Assert build invariants
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import re
          import sys

          failures = []

          def check(name, ok, detail=''):
              print(f'{"PASS" if ok else "FAIL"}: {name}' + (f' ({detail})' if detail else ''))
              if not ok:
                  failures.append(name)

          # Entry files, using the generator's own exclusion rules
          # (top-level NNN-*.md only: no drafts, no template, no failed/).
          files = sorted(
              e.name for e in os.scandir('entries')
              if e.is_file() and re.match(r'^\d+-.+\.md$', e.name)
          )

          # 1. Every entry file produced exactly one proof page.
          pages = sorted(glob.glob('site/dist/proof/*/index.html'))
          check('proof pages match entry files', len(pages) == len(files),
                f'{len(pages)} pages, {len(files)} files')

          # 2. Sitemap lists every proof URL (`/proof/NNN<` matches the closing
          # tag so entry 0012 can never masquerade as entry 001).
          sitemap = open('site/dist/sitemap.xml', encoding='utf-8').read()
          missing = [f for f in files if f'/proof/{f.split("-")[0]}<' not in sitemap]
          check('sitemap lists every proof URL', not missing,
                f'{len(files) - len(missing)}/{len(files)} present'
                + (f'; missing: {missing}' if missing else ''))

          # 3. Search index covers every entry.
          index = json.load(open('site/dist/search-index.json', encoding='utf-8'))
          check('search index matches entry files', len(index) == len(files),
                f'{len(index)} indexed, {len(files)} files')

          # 4. Custom domain pinned.
          try:
              cname = open('site/dist/CNAME', encoding='utf-8').read().strip()
          except OSError:
              cname = None
          check('dist/CNAME contains bloomproof.org', cname == 'bloomproof.org',
                f'CNAME={cname!r}')

          # 5. Donate BTC address tripwire (checks the built page visitors
          # receive, not source).
          donate = open('site/dist/donate/index.html', encoding='utf-8').read()
          if 'bc1q9raslzj2qz0fx8gqvqv40qw79uu2q9rqn23cta' in donate:
              print('PASS: donate page carries the BTC address')
          else:
              print('FAIL: donate page carries the BTC address')
              print('Donate BTC address missing or changed')
              failures.append('btc-tripwire')

          if failures:
              sys.exit(1)
          print('All invariants hold.')
          EOF
